{% extends 'base.html' %}

{% block content %}
<div class="container py-5 max-w-500">
    <div class="fitora-card text-center p-4">
        <div class="rounded-circle bg-danger-subtle d-inline-flex p-3 text-danger mb-3">
            <i class="bi bi-trash3-fill fs-2"></i>
        </div>
        <h4 class="fw-bold text-navy mb-2">Delete Food Entry?</h4>
        <p class="text-muted mb-4">
            Are you sure you want to remove <strong>{{ entry.food_name }}</strong> ({{ entry.calories }} kcal) from your <strong>{{ entry.meal_category }}</strong> diary on {{ entry.date|date:"M d, Y" }}?
        </p>
        <form method="post" class="d-flex justify-content-center gap-2">
            {% csrf_token %}
            <a href="{% url 'food_diary' %}?date={{ entry.date|date:'Y-m-d' }}" class="btn btn-outline-secondary px-4">Cancel</a>
            <button type="submit" class="btn btn-danger px-4">Yes, Delete Entry</button>
        </form>
    </div>
</div>
{% endblock %}
