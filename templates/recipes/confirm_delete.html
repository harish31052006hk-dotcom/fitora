{% extends 'base.html' %}

{% block content %}
<div class="container py-5 max-w-500">
    <div class="fitora-card text-center p-4">
        <div class="rounded-circle bg-danger-subtle d-inline-flex p-3 text-danger mb-3">
            <i class="bi bi-trash3-fill fs-2"></i>
        </div>
        <h4 class="fw-bold text-navy mb-2">Delete Recipe?</h4>
        <p class="text-muted mb-4">
            Are you sure you want to permanently delete <strong>{{ recipe.name }}</strong> and all its ingredient records?
        </p>
        <form method="post" class="d-flex justify-content-center gap-2">
            {% csrf_token %}
            <a href="{% url 'recipe_detail' recipe.id %}" class="btn btn-outline-secondary px-4">Cancel</a>
            <button type="submit" class="btn btn-danger px-4">Yes, Delete Recipe</button>
        </form>
    </div>
</div>
{% endblock %}
