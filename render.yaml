databases:
  - name: fitora-db
    databaseName: fitora
    user: fitora_user
    plan: free

services:
  - type: web
    name: fitora
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_nutrition_data && python manage.py seed_faqs"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: "/health/"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: fitora-db
          property: connectionString
      - key: MONGODB_URI
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: NUTRITION_API_KEY
        sync: false
